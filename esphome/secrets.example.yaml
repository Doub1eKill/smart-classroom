# =============================================================
#  ไฟล์ตัวอย่างรหัส WiFi
#  1) คัดลอกไฟล์นี้แล้วตั้งชื่อใหม่เป็น  secrets.yaml  (โฟลเดอร์เดียวกัน)
#  2) แก้ค่าในเครื่องหมายคำพูด "..." ให้เป็นค่าจริง
#  3) ต้องมีช่องว่าง 1 ช่องหลัง :  และห้ามเว้นวรรคหน้าบรรทัด
#  secrets.yaml ถูกกันไว้ใน .gitignore จะไม่ถูกอัปโหลดขึ้น GitHub
# =============================================================

# ชื่อ WiFi (ต้องเป็นคลื่น 2.4 GHz, ตัวพิมพ์เล็ก/ใหญ่ต้องตรง)
wifi_ssid: "YOUR_WIFI_NAME"
# รหัส WiFi
wifi_password: "YOUR_WIFI_PASSWORD"
# รหัส WiFi สำรอง "Smart-Classroom-Fallback" ที่บอร์ดปล่อยเมื่อต่อ WiFi หลักไม่ได้ (อย่างน้อย 8 ตัว)
ap_password: "classroom118"
# รหัสสำหรับอัปโหลด firmware ผ่าน WiFi (OTA)
ota_password: "change-me"
